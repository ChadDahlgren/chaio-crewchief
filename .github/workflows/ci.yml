name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds each PR against the tip it will actually land on, so
  # the required checks have to run here too. Without this trigger a queued PR
  # waits forever on checks that never start.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (race + vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
          working-directory: gateway

  vuln:
    name: Vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      # More precise than a dependency-graph alert: govulncheck reports only
      # vulnerabilities whose affected symbols this code actually reaches, so
      # a finding here is a real exposure rather than a version match.
      - name: govulncheck
        working-directory: gateway
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  hooks:
    name: Hooks (shellcheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The gate decides whether real work gets blocked, so a regression here is
      # worse than a broken feature — it's an operator who can't write a file.
      - name: shellcheck
        run: shellcheck plugin/hooks/*.sh scripts/*.sh
      - name: Hook tests
        run: ./plugin/hooks/test-hooks.sh

  build-matrix:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }   # DGX Spark & friends
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Build
        working-directory: gateway
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o ../dist/chaio-crewchief-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/chaio-crewchief
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaio-crewchief-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  smoke:
    name: E2E smoke (serve → delegate → async → doctor → usage)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Build binary
        working-directory: gateway
        run: go build -o /tmp/chaio-crewchief ./cmd/chaio-crewchief
      - name: Start stub OpenAI backend
        run: |
          cat > /tmp/stub.py <<'EOF'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json
          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  body = json.dumps({
                      "choices": [{"message": {"content": "```python\ndef add(a, b):\n    return a + b\n```"}}],
                      "usage": {"prompt_tokens": 10, "completion_tokens": 20},
                  }).encode()
                  self.send_response(200); self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body))); self.end_headers()
                  self.wfile.write(body)
              def do_GET(self):
                  self.send_response(200); self.end_headers(); self.wfile.write(b'{}')
              def log_message(self, *a): pass
          HTTPServer(('127.0.0.1', 8080), H).serve_forever()
          EOF
          python3 /tmp/stub.py &
      - name: Start gateway
        run: |
          cat > /tmp/models.yaml <<'EOF'
          models:
            - name: stub
              base_url: http://127.0.0.1:8080
              system_prompt: "You are a code generator."
              default: true
          EOF
          /tmp/chaio-crewchief serve --db /tmp/f.db --models /tmp/models.yaml --archive /tmp/archive --addr :8181 &
          for i in $(seq 1 20); do curl -sf localhost:8181/health >/dev/null && break; sleep 0.5; done
      - name: Sync delegate (delivered, unjudged artifact)
        run: |
          out=$(curl -sf localhost:8181/delegate -H 'Content-Type: application/json' -d '{
            "task":"Write a Python function add(a,b) returning a+b."}')
          echo "$out" | jq -e '.status=="delivered" and (.attempts[-1].outcome=="delivered") and (.artifact | length > 0)'
      - name: retries=0 is single-shot
        run: |
          out=$(curl -sf localhost:8181/delegate -H 'Content-Type: application/json' -d '{
            "task":"x","retries":0}')
          echo "$out" | jq -e '.status=="delivered" and (.attempts | length == 1)'
      - name: Async delegate + poll
        run: |
          id=$(curl -sf localhost:8181/delegate -H 'Content-Type: application/json' \
            -d '{"task":"Write a Python function add(a,b) returning a+b.","async":true}' | jq -r .request_id)
          test -n "$id"
          for i in $(seq 1 20); do
            status=$(curl -sf "localhost:8181/requests/$id" | jq -r .status)
            [ "$status" = "delivered" ] && break; sleep 0.5
          done
          curl -sf "localhost:8181/requests/$id" | jq -e '.status=="delivered" and (.artifact | length > 0)'
      # --gateway is explicit because an unset CHAIO_CREWCHIEF_URL now selects
      # the embedded ledger. Without it these steps would pass while quietly
      # reading an empty local ledger instead of the gateway they just drove.
      - name: doctor + usage subcommands
        env:
          CHAIO_CREWCHIEF_URL: http://localhost:8181
        run: |
          /tmp/chaio-crewchief doctor --gateway
          /tmp/chaio-crewchief usage --gateway | tee /dev/stderr | grep -q "CREW CHIEF USAGE"
      - name: MCP stdio handshake
        run: |
          { printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}\n'
            sleep 1
            printf '{"jsonrpc":"2.0","method":"notifications/initialized"}\n{"jsonrpc":"2.0","id":2,"method":"tools/list"}\n'
            sleep 2; } | /tmp/chaio-crewchief mcp | grep -q crewchief_delegate

      # The scenario a fresh installer actually hits: no gateway running, no
      # config written, no environment variable set. This is what shipped
      # broken in v0.4.0, so it is what CI guards. Nothing in this job exports a
      # gateway URL; the unset is there so a repository- or organization-level
      # env cannot silently turn this back into a proxy test.
      - name: Embedded MCP starts with no gateway and no config
        env:
          CHAIO_CREWCHIEF_HOME: /tmp/embedded-home-mcp
        run: |
          unset CHAIO_CREWCHIEF_URL CREWCHIEF_URL DISPATCH_URL
          out=$({ printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}\n'
            sleep 1
            printf '{"jsonrpc":"2.0","method":"notifications/initialized"}\n{"jsonrpc":"2.0","id":2,"method":"tools/list"}\n'
            sleep 2; } | /tmp/chaio-crewchief mcp)
          echo "$out" | grep -q crewchief_delegate
          test -d /tmp/embedded-home-mcp
          test ! -f /tmp/embedded-home-mcp/models.yaml   # startup must never write config

      # Its own home, not the previous step's: this step leaves a models.yaml
      # behind, and a re-run of the job would then fail that step's
      # "startup must never write config" assertion for the wrong reason.
      - name: init writes a starter config and refuses to clobber it
        env:
          CHAIO_CREWCHIEF_HOME: /tmp/embedded-home-init
        run: |
          /tmp/chaio-crewchief init
          test -f /tmp/embedded-home-init/models.yaml
          if /tmp/chaio-crewchief init; then echo "init overwrote without --force"; exit 1; fi
          /tmp/chaio-crewchief init --force

  release-config:
    name: Validate release config (goreleaser + install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      # Catches a broken .goreleaser.yaml here rather than at tag time, when
      # the only way to retry is to delete and re-push the tag.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check
      - name: Build a full snapshot (all platforms, archives, checksums, cask)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          HOMEBREW_TAP_TOKEN: unused-in-snapshot
      - name: install.sh is valid POSIX sh
        run: sh -n scripts/install.sh
      - name: shellcheck install.sh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/install.sh

  plugin-validate:
    name: Validate plugin + marketplace manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JSON well-formed + required fields
        run: |
          # Bracket-quote the key: jq reads a bare .a-b as "a minus b".
          jq -e '.name=="chaio-crewchief" and .mcpServers["chaio-crewchief"].command=="chaio-crewchief"' plugin/.claude-plugin/plugin.json
          jq -e '.name and (.plugins | length) > 0' .claude-plugin/marketplace.json
      - name: Skills have frontmatter descriptions
        run: |
          for f in plugin/skills/*/SKILL.md; do
            head -5 "$f" | grep -q "^description:" || { echo "missing description: $f"; exit 1; }
          done
      - name: Agents have name + description
        run: |
          for f in plugin/agents/*.md; do
            head -8 "$f" | grep -q "^name:" || { echo "missing name: $f"; exit 1; }
            head -8 "$f" | grep -q "^description:" || { echo "missing description: $f"; exit 1; }
          done
